name: Build skill zip

# On every push to main, build the Claude.ai upload zip (same content packed into under 200 files,
# zipped from the parent folder so the top level is matt-ai/) and attach it to a rolling "latest"
# release. Members on Claude.ai download matt-ai.zip from the Releases page. Members on Claude Code,
# Codex and Cursor install the full skills/ folder with npx skills add, which has no file limit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the skill
        run: |
          pip install -q "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          skills-ref validate skills/matt-ai

      - name: Build the Claude.ai zip (under 200 files) and validate it
        run: |
          python3 tools/build_claudeai_zip.py skills/matt-ai build
          skills-ref validate build/matt-ai
          cp build/matt-ai.zip matt-ai.zip
          unzip -l matt-ai.zip | tail -1

      - name: Attach to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Matt AI (latest)
          body: "Download matt-ai.zip and upload it in Claude under Customize > Skills. See CHANGELOG.md for what changed."
          files: matt-ai.zip
          prerelease: false
